PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers fossy
X11Forwarding no
AllowTcpForwarding no
PrintMotd no
# fo_scheduler self-tests every agent at once on startup; the default
# MaxStartups 10:30:100 drops most of those concurrent connections.
MaxStartups 256
# OpenSSH >= 9.8 penalises a source whose connections get dropped; the
# scheduler is a single trusted source inside the cluster.
PerSourcePenalties no
