{{/*
SPDX-FileCopyrightText: © 2026 Muhammad Salman
SPDX-License-Identifier: FSFAP

Probes use /repo/ rather than /repo/api/v1/health, which returns 503 while
the scheduler is unreachable and would take the UI down on scheduler restarts.
*/}}
{{- $name := printf "%s-web" (include "fossology.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fossology.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  sessionAffinity: {{ .Values.web.service.sessionAffinity }}
  selector:
    {{- include "fossology.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fossology.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "fossology.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fossology.labels" (dict "ctx" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fossology.migrationReader" . }}
      automountServiceAccountToken: false
      {{- include "fossology.podScheduling" . | nindent 6 }}
      initContainers:
        {{- include "fossology.waitMigrationInit" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "fossology.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["web"]
          env:
            {{- include "fossology.dbEnv" . | nindent 12 }}
            - name: FOSSOLOGY_SCHEDULER_HOST
              value: {{ printf "%s-scheduler" (include "fossology.fullname" .) }}
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /repo/
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /repo/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /repo/
              port: http
            periodSeconds: 20
            failureThreshold: 6
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: repository
              mountPath: /srv/fossology/repository
      volumes:
        {{- include "fossology.repositoryVolume" . | nindent 8 }}
        {{- include "fossology.waitMigrationVolume" . | nindent 8 }}
