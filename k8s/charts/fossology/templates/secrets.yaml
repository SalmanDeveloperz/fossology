{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fossology.dbSecretName" . }}
  labels:
    {{- include "fossology.labels" (dict "ctx" . "component" "db") | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
{{- end }}
{{- if and .Values.workers.enabled (not .Values.ssh.existingSecret) }}
{{- $name := include "fossology.sshSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
# Generated once; reused on upgrade so scheduler and workers keep matching keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fossology.labels" (dict "ctx" . "component" "scheduler") | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "id_rsa") }}
  id_rsa: {{ index $existing.data "id_rsa" }}
  {{- else }}
  id_rsa: {{ printf "%s\n" (genPrivateKey "rsa") | b64enc }}
  {{- end }}
{{- end }}
