#
# The scheduler has no local agent slots: [HOSTS] lists only the worker, so
# every agent run proves SSH dispatch over the pod network.
apiVersion: v1
kind: Service
metadata:
  name: fossology-scheduler
  namespace: fossology
spec:
  selector:
    app.kubernetes.io/name: fossology
    app.kubernetes.io/component: scheduler
  ports:
  - name: scheduler
    port: 24693
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fossology-scheduler
  namespace: fossology
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fossology
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fossology
        app.kubernetes.io/component: scheduler
    spec:
      containers:
      - name: scheduler
        image: fossology-k8s:poc
        imagePullPolicy: Never
        args: ["scheduler"]
        envFrom:
        - secretRef:
            name: fossology-db
        env:
        - name: FOSSOLOGY_HOSTS
          value: "worker0 = fossology-worker /usr/local/etc/fossology 10"
        ports:
        - name: scheduler
          containerPort: 24693
        readinessProbe:
          tcpSocket:
            port: scheduler
          periodSeconds: 5
        volumeMounts:
        - name: repository
          mountPath: /srv/fossology/repository
        - name: ssh
          mountPath: /etc/fossology-ssh
          readOnly: true
      volumes:
      - name: repository
        persistentVolumeClaim:
          claimName: fossology-repository
      - name: ssh
        secret:
          secretName: fossology-ssh
          items:
          - key: id_ed25519
            path: id_ed25519
