#
# NodePort 30081 is mapped to host port 8082 by kind-config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: fossology-web
  namespace: fossology
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fossology
    app.kubernetes.io/component: web
  ports:
  - name: http
    port: 80
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fossology-web
  namespace: fossology
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fossology
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fossology
        app.kubernetes.io/component: web
    spec:
      containers:
      - name: web
        image: fossology-k8s:poc
        imagePullPolicy: Never
        args: ["web"]
        envFrom:
        - secretRef:
            name: fossology-db
        env:
        - name: FOSSOLOGY_SCHEDULER_HOST
          value: fossology-scheduler
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /repo/api/v1/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: repository
          mountPath: /srv/fossology/repository
      volumes:
      - name: repository
        persistentVolumeClaim:
          claimName: fossology-repository
