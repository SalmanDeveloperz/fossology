apiVersion: v1
kind: Service
metadata:
  name: fossology-db
  namespace: fossology
spec:
  selector:
    app.kubernetes.io/name: fossology
    app.kubernetes.io/component: db
  ports:
  - name: postgres
    port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fossology-db
  namespace: fossology
spec:
  serviceName: fossology-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fossology
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fossology
        app.kubernetes.io/component: db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: fossology-db, key: FOSSOLOGY_DB_NAME}}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: fossology-db, key: FOSSOLOGY_DB_USER}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: fossology-db, key: FOSSOLOGY_DB_PASSWORD}}
        - name: POSTGRES_INITDB_ARGS
          value: "-E SQL_ASCII"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready --dbname \"$POSTGRES_DB\" --username \"$POSTGRES_USER\""]
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
