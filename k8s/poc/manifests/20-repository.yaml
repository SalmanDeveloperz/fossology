#
# Shared /srv/fossology/repository for web, scheduler and workers.
# kind has a single node, so a ReadWriteOnce local-path volume can be mounted
# by every pod. Multi-node clusters need a ReadWriteMany storage class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fossology-repository
  namespace: fossology
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
